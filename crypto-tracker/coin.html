<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto Tracke</title>
  <link rel="stylesheet" href="CSS/coin.css">
  <script src="src/coin.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Crypto Tracke</h1>
    <form id="searchForm" class="search-section">
      <input type="text" id="coinInput" aria-label="Coin name" placeholder="Enter coin name (e.g., bitcoin)" autocomplete="off">
      <button id="fetchBtn" type="submit">Get Prices</button>
    </form>
    <div id="messageArea" role="status">Enter a coin name to compare prices</div>
    <div id="resultsContainer"></div>
    <div class="footer-actions">
      <button id="clearBtn" type="button">Clear Search</button>
    </div>
  </main>
</body>
</html>
